lane_id: NIGHT-RUNNER-18-SAMPLE
task_name: Manual bedtime trial wrapper
task_mode: reported_patch
allowed_files:
  - scripts/diagnostics/night_runner_readiness_summary.py
  - scripts/quality/night_runner_readiness_summary_smoke.py
  - scripts/diagnostics/night_runner_patch_review.py
  - scripts/quality/night_runner_patch_review_smoke.py
  - docs/ops/NIGHT_RUNNER_BEDTIME_WORKFLOW_V2.md
  - docs/ops/night_runner_bedtime_packet_v2.yaml
  - scripts/quality/night_runner_bedtime_packet_v2_smoke.py
  - scripts/ops/night_runner_bedtime_trial.py
  - scripts/quality/night_runner_bedtime_trial_smoke.py
  - docs/ops/night_runner_tiny_task_packet.yaml
  - docs/ops/NIGHT_RUNNER_DOCS_DIAGNOSTIC.md
forbidden_files:
  - clients/karen/CLIENT_GROCERY.md
  - clients/karen/CLIENT_FOLDERS.json
  - val0_memory.enc.db
  - "*.db"
  - "*.sqlite"
  - /etc/val0
